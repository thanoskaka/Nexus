version: "3.9"

services:
  nexus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-portfolio
    ports:
      - "6868:6868"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=6868
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6868/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
